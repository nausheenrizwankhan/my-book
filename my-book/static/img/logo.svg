<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Frame -->
  <rect x="2" y="2" width="36" height="36" stroke="#00e5ff" stroke-width="2" fill="none"/>

  <!-- Inner Geometric Robot Head -->
  <path d="M12 10 L28 10 L28 12 L30 12 L30 18 L28 18 L28 28 L12 28 L12 18 L10 18 L10 12 L12 12 Z"
        fill="#0a0e12" stroke="#00e5ff" stroke-width="1.5"/>

  <!-- Eyes -->
  <rect x="15" y="15" width="3" height="3" fill="#d32f2f"/>
  <rect x="22" y="15" width="3" height="3" fill="#d32f2f"/>

  <!-- Antenna -->
  <line x1="20" y1="10" x2="20" y2="6" stroke="#00e5ff" stroke-width="1.5"/>
  <circle cx="20" cy="5" r="1.5" fill="#d32f2f"/>

  <!-- Mouth/Grid -->
  <line x1="16" y1="22" x2="24" y2="22" stroke="#00e5ff" stroke-width="1"/>
  <line x1="16" y1="24" x2="24" y2="24" stroke="#00e5ff" stroke-width="1"/>

  <!-- Circuit Lines -->
  <line x1="4" y1="20" x2="10" y2="20" stroke="#00e5ff" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="30" y1="20" x2="36" y2="20" stroke="#00e5ff" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Corner Markers -->
  <circle cx="4" cy="4" r="1.5" fill="#d32f2f"/>
  <circle cx="36" cy="4" r="1.5" fill="#d32f2f"/>
  <circle cx="4" cy="36" r="1.5" fill="#d32f2f"/>
  <circle cx="36" cy="36" r="1.5" fill="#d32f2f"/>
</svg>
