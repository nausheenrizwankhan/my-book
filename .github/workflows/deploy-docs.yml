name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-book/package-lock.json

      - name: Install dependencies
        run: npm install --frozen-lockfile
        working-directory: ./my-book

      - name: Build website
        run: npm run build
        working-directory: ./my-book

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./my-book/build
          # The following lines deploy to a gh-pages branch in the same repository.
          # If you're deploying to a different repository, you may need to tweak these settings.
          # cname: example.com
          # user_name: 'github-actions[bot]'
          # user_email: 'github-actions[bot]@users.noreply.github.com'
